---
# GPU vendor isn't known ahead of time (VM now, real hardware later), so
# detect it at run time instead of hardcoding a variable per deploy.
- name: Detect GPU controller via lspci
  shell: lspci -nnk | grep -Ei 'VGA|3D controller'
  register: gpu_lspci
  changed_when: false
  failed_when: false

- name: Set gpu_vendor fact
  set_fact:
    gpu_vendor: >-
      {{ 'nvidia' if 'NVIDIA' in gpu_lspci.stdout
         else 'amd' if ('AMD' in gpu_lspci.stdout or 'ATI' in gpu_lspci.stdout)
         else 'intel' if 'Intel' in gpu_lspci.stdout
         else 'virtio' if ('Red Hat' in gpu_lspci.stdout or 'QXL' in gpu_lspci.stdout or 'VirtIO' in gpu_lspci.stdout)
         else 'vmware' if 'VMware' in gpu_lspci.stdout
         else 'virtualbox' if 'VirtualBox' in gpu_lspci.stdout
         else 'unknown' }}

- name: Report detected GPU vendor
  debug:
    msg: "Detected GPU vendor: {{ gpu_vendor }}"

- name: Install AMD driver stack
  pacman:
    name: [mesa, vulkan-radeon, xf86-video-amdgpu]
    state: present
  when: gpu_vendor == 'amd'

- name: Install Intel driver stack
  pacman:
    name: [mesa, vulkan-intel]
    state: present
  when: gpu_vendor == 'intel'

# The traditional closed-source nvidia/nvidia-dkms packages have been
# removed from Arch's repos entirely - only the open-source kernel module
# remains. DKMS (not the kernel-version-locked nvidia-open) so it builds
# against both linux and linux-lts, matching our kernel-hedge design;
# linux-headers is needed alongside the linux-lts-headers roles/base
# already installs, so DKMS has headers for both.
- name: Install Nvidia open-source kernel module (proprietary driver no longer exists in Arch repos)
  pacman:
    name: [nvidia-open-dkms, nvidia-utils, nvidia-settings, linux-headers]
    state: present
  when: gpu_vendor == 'nvidia'

# QEMU/KVM with the virtio-gpu or QXL device (most common for VM testing).
- name: Install virtio/QEMU guest stack
  pacman:
    name: [mesa, qemu-guest-agent, spice-vdagent]
    state: present
  when: gpu_vendor == 'virtio'

- name: Enable qemu-guest-agent
  systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: gpu_vendor == 'virtio'

# xf86-video-vmware has been removed from Arch's repos - the generic
# "modesetting" driver bundled with xorg-server handles VMware SVGA now.
# xf86-input-vmmouse fixes absolute-mode mouse capture in the guest.
- name: Install VMware guest stack
  pacman:
    name: [mesa, xf86-input-vmmouse, open-vm-tools]
    state: present
  when: gpu_vendor == 'vmware'

# Found by inspection, not a VM boot: this package was installed but never
# enabled anywhere, unlike the virtio path just above. Without vmtoolsd,
# none of open-vm-tools' actual guest integration (clipboard, time sync,
# resolution auto-fit) turns on - vmware-vmblock-fuse is needed separately,
# specifically for host/guest drag-and-drop and copy-paste file transfer.
- name: Enable open-vm-tools services
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - vmtoolsd.service
    - vmware-vmblock-fuse.service
  when: gpu_vendor == 'vmware'

- name: Install VirtualBox guest stack
  pacman:
    name: [mesa, virtualbox-guest-utils]
    state: present
  when: gpu_vendor == 'virtualbox'

- name: Enable VirtualBox guest service
  systemd:
    name: vboxservice.service
    enabled: true
    state: started
  when: gpu_vendor == 'virtualbox'

- name: Warn on unrecognized GPU
  debug:
    msg: "Could not identify GPU from lspci output - install a driver manually and extend this role."
  when: gpu_vendor == 'unknown'
