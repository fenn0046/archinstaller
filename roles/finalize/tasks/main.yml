---
# Revoke the passwordless sudo that roles/aur granted for makepkg/paru to
# install packages non-interactively - no longer needed once provisioning
# is done, unless explicitly kept.
- name: Remove aur_build_user's passwordless sudo grant
  file:
    path: "/etc/sudoers.d/10-{{ aur_build_user }}-nopasswd"
    state: absent
  when: not (keep_passwordless_sudo | bool)

# Only used by the iso/ baked-credential flow (force_password_expiry=true
# passed via -e), never the bootstrap/ manual flow where the user set a
# real password themselves. Must run here, at the very end, not at install
# time - archuser's password has to stay valid for every become_user:
# archuser task earlier in this same playbook run (aur/gaming/experimental
# roles) and for the first-boot service's own `sudo -u archuser git clone`.
# Expiring it any earlier breaks all of that non-interactively.
- name: Force password change on next login (baked-credential ISO flow only)
  command: "chage -d 0 {{ item }}"
  loop:
    - "{{ aur_build_user }}"
    - root
  when: force_password_expiry | bool

# A reboot is genuinely needed here, not just tidy: the GPU driver (Nvidia
# especially) wants a fresh boot to load correctly, and SDDM was only
# enabled (starts on next boot) rather than started. Doing it automatically
# is what makes the whole pipeline hands-off through to the login screen.
- name: Reboot into the fully provisioned system
  reboot:
    msg: "Rebooting after arch-project provisioning"
    reboot_timeout: 300
  when: reboot_after_provision | bool
