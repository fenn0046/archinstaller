---
# makepkg (and later, paru itself when installing packages) escalates from
# aur_build_user UP to root via its own internal sudo call - unlike Ansible's
# own become_user (root de-escalating to aur_build_user, which needs no
# password), this direction genuinely requires either an interactive prompt
# or NOPASSWD. There's nobody to answer a prompt in the unattended flow, so
# this grants it here rather than only documenting it as a manual step.
# roles/finalize removes it again once provisioning is fully done, unless
# keep_passwordless_sudo is set true.
- name: Grant aur_build_user passwordless sudo (needed for makepkg/paru to install packages non-interactively)
  copy:
    dest: "/etc/sudoers.d/10-{{ aur_build_user }}-nopasswd"
    content: "{{ aur_build_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Ensure build tooling is present
  pacman:
    name: [base-devel, git]
    state: present

- name: Check whether paru is already installed
  command: which paru
  register: paru_check
  failed_when: false
  changed_when: false

# AUR packages must be built as a normal user - makepkg refuses to run as
# root. The build user needs passwordless sudo for this to work
# non-interactively (see README "AUR / sudoers" section).
- name: Build and install paru from the AUR
  when: aur_helper == 'paru' and paru_check.rc != 0
  become: true
  become_user: "{{ aur_build_user }}"
  block:
    - name: Clone paru-bin
      git:
        repo: https://aur.archlinux.org/paru-bin.git
        dest: /tmp/paru-bin
        force: true

    - name: Build and install paru-bin
      command: makepkg -si --noconfirm
      args:
        chdir: /tmp/paru-bin
        creates: /usr/bin/paru
