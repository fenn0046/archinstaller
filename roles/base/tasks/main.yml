---
# archinstall's pacstrap already initializes a working keyring (-K flag),
# but the local trust database can still be missing trust for recently
# rotated packager keys until archlinux-keyring-wkd-sync.service/.timer
# gets around to refreshing it - which happens asynchronously and isn't
# guaranteed to finish before this first-boot run starts installing
# packages. Repopulating explicitly here avoids a real (not just
# theoretical) race: "signature ... is unknown trust" errors on packages
# signed by a key the keyring hasn't caught up on yet.
- name: Ensure the local pacman keyring trusts current packager keys
  command: pacman-key --populate archlinux
  changed_when: true

- name: Sync pacman package databases
  pacman:
    update_cache: true

- name: Install base packages
  pacman:
    name: "{{ base_packages }}"
    state: present

- name: Enable NetworkManager
  systemd:
    name: NetworkManager
    enabled: true
    state: started

- name: Enable reflector timer (keeps mirrorlist fast/current)
  systemd:
    name: reflector.timer
    enabled: true
    state: started

# --- Kernel fallback: the core of the "hedge" ---
# `linux` stays the default, cutting-edge kernel. Installing linux-lts
# alongside it means a broken kernel/module update on the default kernel
# still leaves a bootable, working entry in the boot menu.
- name: Install LTS kernel as a fallback boot option
  pacman:
    name:
      - linux-lts
      - linux-lts-headers
    state: present
  when: kernel_lts_fallback | bool
  notify: regenerate grub config

- name: Flush handlers so GRUB picks up the new kernel entry now
  meta: flush_handlers
